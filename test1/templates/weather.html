<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .card {
            margin-top: 100px;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        body.clear {
    background-image: url('https://i.imgur.com/UxkYp.jpg');
}
body.clouds {
    background-image: url('https://i.imgur.com/3KXqZ.jpg');
}
body.rain {
    background-image: url('https://i.imgur.com/t4H0M.jpg');
}
body.snow {
    background-image: url('https://i.imgur.com/HhX7d.jpg');
}
body.default {
    background: linear-gradient(to right, #2c3e50, #3498db);
}

    </style>
</head>

<body class="
    {% if weather %}
        {% if weather.main == 'Clear' %} clear
        {% elif weather.main == 'Clouds' %} clouds
        {% elif weather.main == 'Rain' %} rain
        {% elif weather.main == 'Snow' %} snow
        {% else %} default
        {% endif %}
    {% else %}
        default
    {% endif %}
">

    <div class="card">
        <h1>🌤 Weather App</h1>
        <form method="POST" action="{% url 'weather'  %}">
            {% csrf_token %}
            <input type="text" name="city" placeholder="Enter city" required>
            <button type="submit">Search</button>
        </form>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        {% if weather %}
            <h2>{{ weather.city }}</h2>
            <h3>{{ weather.temp }} °C</h3>
            <p>{{ weather.description }}</p>
            <img src="http://openweathermap.org/img/wn/{{ weather.icon }}@2x.png" alt="icon">
        {% endif %}
    </div>
</body>
</html>
